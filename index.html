<style id="app-style">
/* Layout: семейная папка за кодом — экран входа, потом карточки людей, древо-схема с масштабом, вкладки внизу */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #16202b; --muted: #5b6674; --line: #d6dce3;
  --accent: #1f5fcf; --accent-ink: #ffffff; --accent-soft: #e6eefc;
  --pa: #2e7d5b; --dad: #2a5d8f; --mom: #a3385b; --ma: #7a4b8c; --me: #16202b;
  --pa-soft: #e5f2ec; --dad-soft: #e4edf7; --mom-soft: #f8e6ec; --ma-soft: #efe7f4; --me-soft: #e9edf2;
  --version: #8f5300; --version-bg: #fff2d9; --conflict: #a8261d; --conflict-bg: #fdeceb;
  --family: #6a2fa6; --family-bg: #f2e9fc; --ok: #1d7a4b; --ok-bg: #e3f4ea;
  --shadow: 0 1px 2px rgba(18,28,40,.06), 0 6px 18px rgba(18,28,40,.07);
  --scrim: rgba(12,18,26,.45);
  --font-ui: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --font-name: "Literata", Georgia, "Times New Roman", serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #18202a; --surface-2: #1d2631; --ink: #e8edf3; --muted: #9ba7b5; --line: #2d3845;
    --accent: #79a8ff; --accent-ink: #0b1220; --accent-soft: #1c2a45;
    --pa: #72cfa2; --dad: #8cb9e8; --mom: #ef9bb6; --ma: #caa6e2; --me: #e8edf3;
    --pa-soft: #16291f; --dad-soft: #172435; --mom-soft: #301a22; --ma-soft: #261d30; --me-soft: #1d2631;
    --version: #f0b65a; --version-bg: #3a2c12; --conflict: #ff8f86; --conflict-bg: #3d1e1c;
    --family: #d6b3fd; --family-bg: #2c1b45; --ok: #6fd39c; --ok-bg: #16301f;
    --shadow: none; --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #18202a; --surface-2: #1d2631; --ink: #e8edf3; --muted: #9ba7b5; --line: #2d3845;
  --accent: #79a8ff; --accent-ink: #0b1220; --accent-soft: #1c2a45;
  --pa: #72cfa2; --dad: #8cb9e8; --mom: #ef9bb6; --ma: #caa6e2; --me: #e8edf3;
  --pa-soft: #16291f; --dad-soft: #172435; --mom-soft: #301a22; --ma-soft: #261d30; --me-soft: #1d2631;
  --version: #f0b65a; --version-bg: #3a2c12; --conflict: #ff8f86; --conflict-bg: #3d1e1c;
  --family: #d6b3fd; --family-bg: #2c1b45; --ok: #6fd39c; --ok-bg: #16301f;
  --shadow: none; --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font-ui); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom, 0px)); }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--font-name); font-weight: 700; font-size: clamp(28px, 7vw, 40px); line-height: 1.1; margin: 4px 0 8px; text-wrap: balance; }
h2 { font-family: var(--font-name); font-weight: 700; font-size: 24px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
.lead { color: var(--muted); margin: 0 0 14px; max-width: 62ch; }
.small { font-size: 14px; color: var(--muted); }

.howto { margin: 4px 0 16px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 4px; }
.howto span { display: flex; gap: 8px; align-items: baseline; }
.howto b { flex: 0 0 auto; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.tree-hint { font-size: 14px; color: var(--muted); margin: 8px 2px 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 11px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 17px; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; border-radius: 11px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left; }

/* chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--c, var(--muted)); flex: 0 0 auto; }

/* tree */
.tree-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 8px 0 10px; }
.zoom { display: flex; gap: 6px; }
.zoom button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 600; cursor: pointer; }
.zoom button.fit { width: auto; padding: 0 12px; font-size: 15px; }
.tree-scroll { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--surface-2); max-height: 72vh; min-height: 300px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.tree-sizer { position: relative; }
.tree { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 22px 18px 26px; width: max-content; }
.tree ul { position: relative; display: flex; justify-content: center; padding: 26px 0 0; margin: 0; list-style: none; }
.tree > ul { padding-top: 0; }
.tree li { position: relative; display: flex; flex-direction: column; align-items: center; padding: 26px 7px 0; list-style: none; }
.tree > ul > li { padding-top: 0; }
.tree li::before, .tree li::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 26px; border-top: 3px solid var(--line); }
.tree li::after { right: auto; left: 50%; border-left: 3px solid var(--line); margin-left: -1.5px; }
.tree li:only-child::before { display: none; }
.tree li:only-child::after { border-top: 0; border-radius: 0; }
.tree > ul > li:only-child::after { display: none; }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
.tree li:last-child::before { border-right: 3px solid var(--line); border-radius: 0 12px 0 0; margin-right: -1.5px; }
.tree li:first-child::after { border-radius: 12px 0 0 0; }
.tree ul ul::before { content: ""; position: absolute; top: 0; left: 50%; border-left: 3px solid var(--line); width: 0; height: 26px; margin-left: -1.5px; }
.tn { --c: var(--muted); --cs: var(--surface); position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 156px; height: 124px; padding: 10px 11px; border-radius: 14px; border: 2px solid var(--c); background: var(--cs); color: var(--ink); text-align: left; cursor: pointer; box-shadow: var(--shadow); }
.tn .r { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--c); }
.tn .n { font-family: var(--font-name); font-size: 15.5px; font-weight: 600; line-height: 1.18; }
.tn .y { margin-top: auto; font-size: 12.5px; color: var(--muted); line-height: 1.2; }
.tn .badge { position: absolute; top: -9px; right: -9px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--family); color: var(--surface); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.tn.unk, .tn.ver, .tn.add { border-style: dashed; }
.tn.unk .n { color: var(--muted); }
.tn.me { --c: var(--me); background: var(--ink); color: var(--bg); width: 176px; height: 96px; align-items: center; justify-content: center; text-align: center; }
.tn.me .r { color: var(--bg); opacity: .75; }
.tn.me .n { font-size: 22px; }
.b-pa { --c: var(--pa); --cs: var(--pa-soft); } .b-dad { --c: var(--dad); --cs: var(--dad-soft); } .b-mom { --c: var(--mom); --cs: var(--mom-soft); } .b-ma { --c: var(--ma); --cs: var(--ma-soft); } .b-me { --c: var(--me); --cs: var(--me-soft); } .b-add { --c: var(--family); --cs: var(--family-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 2px 0; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend .dash { width: 22px; height: 14px; border: 2px dashed var(--muted); border-radius: 4px; }

/* people list */
.search { width: 100%; min-height: 50px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; margin: 4px 0 6px; }
.group-title { display: flex; align-items: center; gap: 8px; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; cursor: pointer; }
.row:first-child { border-top: 0; }
.ava { --c: var(--muted); width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: var(--surface); background: var(--c); }
.row .txt { min-width: 0; flex: 1 1 auto; }
.row .nm { display: block; font-family: var(--font-name); font-weight: 600; font-size: 17px; line-height: 1.25; }
.row .rl { display: block; font-size: 14px; color: var(--muted); }
.row .cnt { flex: 0 0 auto; font-size: 13px; font-weight: 700; color: var(--family); background: var(--family-bg); border-radius: 999px; padding: 3px 9px; }
.chev { flex: 0 0 auto; color: var(--muted); font-size: 22px; }

/* docs */
.docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.doc-card { display: flex; flex-direction: column; gap: 8px; padding: 0 0 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; cursor: pointer; text-align: left; }
.doc-card .thumb { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; background: var(--surface-2); object-fit: cover; display: block; }
.doc-card .thumb.ph { display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.doc-card b { display: block; padding: 0 12px; font-size: 15px; line-height: 1.3; }
.doc-card span { display: block; padding: 0 12px; font-size: 13px; color: var(--muted); line-height: 1.3; }

/* help & archives */
.q { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.q .who { font-size: 14px; color: var(--muted); }
.q .text { font-weight: 600; font-size: 17px; line-height: 1.35; }
.q-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.arch { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.arch-item { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.arch-item b { font-size: 17px; }
.arch-item p { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.4; }
.arch-item .url { font-size: 14px; word-break: break-all; }
.steps { margin: 0; padding-left: 22px; }
.steps li { margin: 0 0 8px; }

/* notes */
.notes { display: flex; flex-direction: column; gap: 10px; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--family-bg); border: 1px solid var(--line); }
.note .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.note .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.note .pics { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.note .pics img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; }
.empty { padding: 14px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 15px; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
.nav button { height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }

/* overlay sheets */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; justify-content: center; align-items: stretch; }
.sheet { position: relative; width: 100%; max-width: 720px; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .overlay { align-items: flex-start; padding: 28px 16px; } .sheet { max-height: calc(100% - 0px); border-radius: 22px; } }
.sheet-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: calc(6px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-bar .t { flex: 1 1 auto; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { flex: 0 0 auto; white-space: nowrap; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.sheet-body { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.p-head { display: flex; gap: 14px; align-items: flex-start; }
.p-head .ava { width: 56px; height: 56px; flex-basis: 56px; font-size: 19px; }
.p-head .role { font-size: 15px; color: var(--muted); }
.p-head .yrs { font-size: 15px; margin-top: 2px; }
.p-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 4px; }
.facts { margin: 0; padding-left: 20px; }
.facts li { margin: 0 0 8px; }
.box { padding: 12px 14px; border-radius: 14px; font-size: 16px; line-height: 1.45; }
.box.version { background: var(--version-bg); color: var(--ink); border: 1px solid var(--line); }
.box.version b { color: var(--version); }
.box.conflict { background: var(--conflict-bg); border: 1px solid var(--line); }
.box.conflict b { color: var(--conflict); }
.rel-row { display: flex; flex-direction: column; gap: 8px; }
.rel { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.rel .ava { width: 36px; height: 36px; flex-basis: 36px; font-size: 13px; }
.rel .k { display: block; font-size: 13px; color: var(--muted); }
.rel .v { display: block; font-weight: 600; }
.rel.unknown { border-style: dashed; }
.unk-list { display: flex; flex-wrap: wrap; gap: 8px; }
.doc-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; }
.field label { font-weight: 600; }
.field .hint { font-size: 14px; color: var(--muted); }
.input, textarea.input, select.input { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; }
textarea.input { min-height: 150px; resize: vertical; line-height: 1.45; }
.notice { padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 15px; line-height: 1.45; margin: 0 0 14px; }
.notice.warn { background: var(--version-bg); }
.notice.ok { background: var(--ok-bg); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }

/* pin */
.pin { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 12px 0 4px; }
.pin-dots { display: flex; gap: 14px; margin: 6px 0; }
.pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
.pin-dots i.on { background: var(--ink); }
.pin-err { min-height: 22px; color: var(--conflict); font-weight: 600; font-size: 15px; }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; }
.keypad button { height: 76px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 28px; font-weight: 600; cursor: pointer; }
.keypad button.ghost { border: 0; background: none; font-size: 16px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* doc viewer */
.viewer-img { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 12px; background: var(--surface-2); }
.viewer-scroll { overflow: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
.viewer-scroll.zoomed .viewer-img { width: 220%; max-width: none; }
.transcript { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.5; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 80; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: var(--shadow); }
.del { display: block; margin-top: 6px; font-size: 14px; }
.linkbtn.muted { color: var(--muted); font-weight: 500; }
.linkbtn.danger { color: var(--conflict); }
.mode { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ok); font-weight: 600; }
.foot { margin-top: 28px; font-size: 14px; color: var(--muted); }
.lock { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lock .lock-mark { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--accent); box-shadow: var(--shadow); }
.lock .lock-mark svg { width: 30px; height: 30px; }
.lock h1 { margin: 4px 0 0; }
.remember { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); margin-top: 6px; cursor: pointer; }
.remember input { width: 22px; height: 22px; accent-color: var(--accent); }

    function drawActions() {
      actions.textContent = '';
      if (canEdit === false) { actions.appendChild(noEditNotice()); actions.appendChild(sendBlock(message)); return; }
      actions.appendChild(saveButton(function (save) {
        var text = ta.value.trim();
        if (!text && !photos.length) { status.textContent = ''; status.appendChild(h('p', { class: 'notice warn', text: 'Напишите хотя бы пару слов.' })); ta.focus(); return; }
        store.set('drevo-author', who.input.value.trim());
        save.disabled = true; save.textContent = 'Сохраняю…';
        var note = { id: uid('n'), personId: personId || '', author: who.input.value.trim(), text: text, date: new Date().toISOString(), photos: photos };
        saveState(function (st) { st.notes.push(note); }, { kind: 'note', id: note.id, draftKey: draftKey }).then(function (r) {
          if (r.ok) store.del(draftKey);
          handleSaveResult(r, save, status, drawActions, 'Сохранено. Страница сейчас обновится.');
        });
      }));
      actions.appendChild(h('div', { style: 'height:10px' }));
      actions.appendChild(h('details', null, h('summary', { class: 'small', text: 'Не получается сохранить? Отправьте текст в Telegram' }), sendBlock(message)));
    }
    drawPhotoField(); drawActions();
    currentForm = { refresh: function () { drawPhotoField(); drawActions(); } };
    openOverlay(title, body);
    if (chipLabel) insertLabel(chipLabel);
  }
  function openRelativeForm(personId, relation) {
    var p = P[personId];
    var body = h('div');
    body.appendChild(h('h2', { text: 'Добавить родственника' }));
    body.appendChild(h('p', { class: 'small', text: 'Для кого: ' + personName(personId) + ' (' + p.rel.toLowerCase() + ')' }));
    var sel = h('select', { id: 'rel-kind', class: 'input' });
    RELATIONS.forEach(function (r) { var o = h('option', { value: r, text: r }); if (r === relation) o.selected = true; sel.appendChild(o); });
    var nm = h('input', { id: 'rel-name', class: 'input', type: 'text', placeholder: 'Имя, отчество, фамилия' });
    var yrs = h('input', { id: 'rel-years', class: 'input', type: 'text', placeholder: 'Например: 1915–1990 или около 1915' });
    var about = h('textarea', { id: 'rel-about', class: 'input', placeholder: 'Что о нём или о ней известно (по желанию)' });
    var draftKey = 'drevo-rel-' + personId;
    try { var dr = JSON.parse(store.get(draftKey) || 'null'); if (dr) { nm.value = dr.name || ''; yrs.value = dr.years || ''; about.value = dr.text || ''; if (dr.relation && !relation) sel.value = dr.relation; } } catch (e) {}
    function keep() { store.set(draftKey, JSON.stringify({ name: nm.value, years: yrs.value, text: about.value, relation: sel.value })); }
    [nm, yrs, about].forEach(function (x) { x.addEventListener('input', keep); }); sel.addEventListener('change', keep);
    body.appendChild(h('div', { class: 'field' }, h('label', { for: 'rel-kind', text: 'Кем приходится' }), sel));
    body.appendChild(h('div', { class: 'field' }, h('label', { for: 'rel-name', text: 'Как зовут' }), nm));
    body.appendChild(h('div', { class: 'field' }, h('label', { for: 'rel-years', text: 'Годы жизни' }), yrs));
    body.appendChild(h('div', { class: 'field' }, h('label', { for: 'rel-about', text: 'Что известно' }), about));
    var who = authorField(); body.appendChild(who.el);
    var status = h('div'); var actions = h('div');
    body.appendChild(status); body.appendChild(actions);
    function message() { return 'Новый родственник для семейного древа: ' + sel.value.toLowerCase() + ' — ' + personName(personId) + ':\n' + nm.value.trim() + (yrs.value.trim() ? ' (' + yrs.value.trim() + ')' : '') + (about.value.trim() ? '\n' + about.value.trim() : '') + (who.input.value.trim() ? '\n— ' + who.input.value.trim() : ''); }
    function drawActions() {
      actions.textContent = '';
      if (canEdit === false) { actions.appendChild(noEditNotice()); actions.appendChild(sendBlock(message)); return; }
      actions.appendChild(saveButton(function (save) {
        if (!nm.value.trim()) { status.textContent = ''; status.appendChild(h('p', { class: 'notice warn', text: 'Напишите хотя бы имя.' })); nm.focus(); return; }
        store.set('drevo-author', who.input.value.trim());
        save.disabled = true; save.textContent = 'Сохраняю…';
        var rec = { id: uid('a'), personId: personId, relation: sel.value, name: nm.value.trim(), years: yrs.value.trim(), text: about.value.trim(), author: who.input.value.trim(), date: new Date().toISOString() };
        saveState(function (st) { st.added.push(rec); }, { kind: 'added', id: rec.id, draftKey: draftKey }).then(function (r) {
          if (r.ok) store.del(draftKey);
          handleSaveResult(r, save, status, drawActions, 'Сохранено. Страница сейчас обновится.');
        });
      }));
      actions.appendChild(h('div', { style: 'height:10px' }));
      actions.appendChild(h('details', null, h('summary', { class: 'small', text: 'Не получается сохранить? Отправьте текст в Telegram' }), sendBlock(message)));
    }
    drawActions();
    currentForm = { refresh: drawActions };
    openOverlay('Добавить родственника', body);
  }

  /* ---------- toast & pending ---------- */
  function toast(text) {
    var t = h('div', { class: 'toast', role: 'status', text: text });
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 4200);
  }
  function checkPending() {
    var raw = sess.get('drevo-pending'); if (!raw) return;
    sess.del('drevo-pending');
    try {
      var pend = JSON.parse(raw);
      var list = (pend.kind === 'added' || pend.kind === 'delete-added') ? S.added : S.notes;
      var found = list.some(function (x) { return x.id === pend.id; });
      if (String(pend.kind).indexOf('delete') === 0) { setTimeout(function () { toast(found ? 'Не удалилось — попробуйте ещё раз.' : 'Удалено.'); }, 300); return; }
      if (found) { store.del(pend.draftKey); setTimeout(function () { toast('Сохранено. Спасибо!'); }, 300); }
      else setTimeout(function () { toast('Не сохранилось — откройте форму ещё раз, текст на месте.'); }, 300);
    } catch (e) {}
  }

  /* ---------- boot ---------- */
  try { ENV = JSON.parse(document.getElementById('family-state').textContent); } catch (e) { ENV = null; }
  if (ENV && !ENV.ct && ENV.persons) { startApp(ENV); return; }
  var saved = sess.get('drevo-pin') || store.get('drevo-pin');
  if (saved && cryptoOk() && ENV) {
    renderWait();
    unlock(saved, !!store.get('drevo-pin')).then(function (ok) { if (!ok) { store.del('drevo-pin'); sess.del('drevo-pin'); renderLock(); } });
  } else renderLock();
})();
</script>
</body>
